[package]
name = "purpamail"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "=0.36.2"
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
egui_extras = { version = "=0.36.1", features = ["all_loaders"] }
egui-phosphor = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rusqlite = { version = "0.40", features = ["bundled"] }
mail-parser = "0.11"
mail-builder = "1.0"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder", "hostname"] }
native-tls = "0.2"
notify-rust = "4"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
regex = "1"
parking_lot = "0.12"
base64 = "0.22"
once_cell = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
